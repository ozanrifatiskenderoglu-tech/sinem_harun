<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nişan Anı Albümü</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body class="bg-rose-50 text-slate-800 min-h-screen flex flex-col items-center justify-between p-4 font-sans">

  <!-- Header -->
  <header class="w-full max-w-md flex justify-between items-center py-4">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">💍</span>
      <h1 class="font-bold text-lg text-rose-950">Anı Albümüz</h1>
    </div>
    <button onclick="openAdminModal()" class="p-2 text-rose-400 hover:text-rose-700 bg-white rounded-full shadow-sm">
      🔒
    </button>
  </header>

  <!-- Ana Yükleme Kartı (Misafir Görünümü) -->
  <main class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 text-center space-y-6 my-auto">
    <div class="space-y-2">
      <h2 class="text-2xl font-extrabold text-slate-800">Hoş Geldiniz! 💕</h2>
      <p class="text-sm text-slate-600">
        Bu mutlu günümüzden çektiğiniz fotoğraf ve videoları yükleyerek anılarımızı ölümsüzleştirin.
      </p>
    </div>

    <!-- Cloudinary Yükleme Butonu -->
    <button id="upload_widget" class="w-full bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-rose-200 transition duration-200 flex items-center justify-center space-x-2">
      <span class="text-xl">📸</span>
      <span>Fotoğraf / Video Yükle</span>
    </button>

    <div id="status_msg" class="text-xs font-semibold text-emerald-600 hidden">
      ✅ Harika! Yüklemeniz başarıyla tamamlandı.
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center text-xs text-rose-400 py-4">
    Ozan & Nişanlısı • Sevgiyle Paylaşın ✨
  </footer>

  <!-- Yönetici Giriş Modalı -->
  <div id="admin_modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-xs text-center space-y-4">
      <h3 class="font-bold text-slate-800">Yönetici Girişi</h3>
      <input type="password" id="admin_pass" placeholder="Şifre (Varsayılan: 1234)" class="w-full border p-2 rounded-lg text-center">
      <div class="flex space-x-2">
        <button onclick="closeAdminModal()" class="w-1/2 bg-slate-100 py-2 rounded-lg text-xs font-bold">İptal</button>
        <button onclick="checkPass()" class="w-1/2 bg-rose-600 text-white py-2 rounded-lg text-xs font-bold">Giriş Yap</button>
      </div>
    </div>
  </div>

  <script>
    // Cloudinary Yükleme Ayarları
    // Lütfen aşağıdaki alanları kendi Cloudinary bilgilerinizle değiştirin:
    const CLOUD_NAME = "demo"; // Kendi Cloud Name bilginizi yazın
    const UPLOAD_PRESET = "unsigned_preset"; // Kendi Unsigned Upload Preset adınızı yazın

    var myWidget = cloudinary.createUploadWidget({
      cloudName: CLOUD_NAME, 
      uploadPreset: UPLOAD_PRESET,
      maxFiles: 20,
      clientAllowedFormats: ["image", "video"],
      sources: ["local", "camera"]
    }, (error, result) => { 
      if (!error && result && result.event === "success") { 
        document.getElementById("status_msg").classList.remove("hidden");
        setTimeout(() => {
          document.getElementById("status_msg").classList.add("hidden");
        }, 5000);
      }
    });

    document.getElementById("upload_widget").addEventListener("click", function(){
      myWidget.open();
    }, false);

    function openAdminModal() {
      document.getElementById("admin_modal").classList.remove("hidden");
    }
    function closeAdminModal() {
      document.getElementById("admin_modal").classList.add("hidden");
    }
    function checkPass() {
      const pass = document.getElementById("admin_pass").value;
      if(pass === "1234") {
        alert("Giriş Başarılı! Fotoğrafları Cloudinary panelinizden veya canlı galeri üzerinden inceleyebilirsiniz.");
        closeAdminModal();
      } else {
        alert("Hatalı Şifre!");
      }
    }
  </script>
</body>
</html>
