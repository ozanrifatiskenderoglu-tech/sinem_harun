<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinem & Harun - Fotoğraf Paylaşımı</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Playfair Display & Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Cloudinary Upload Widget -->
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #1a050b 0%, #2b0914 50%, #150308 100%);
    }
    .font-serif-custom {
      font-family: 'Playfair Display', serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-modal {
      background: rgba(20, 5, 10, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body class="min-h-screen text-rose-50 flex flex-col justify-between relative overflow-x-hidden">

  <!-- Arka Plan Süslemeleri -->
  <div class="fixed -top-32 -left-32 w-96 h-96 bg-rose-900/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed -bottom-32 -right-32 w-96 h-96 bg-amber-900/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Üst Bar & Yönetici Girişi İkonu -->
  <header class="p-4 flex justify-between items-center relative z-20 container mx-auto max-w-4xl">
    <div class="flex items-center space-x-2">
      <i data-lucide="heart" class="w-5 h-5 text-rose-400 fill-rose-400/30"></i>
      <span class="text-xs uppercase tracking-widest text-rose-200/70 font-light">Anı Albümü</span>
    </div>
    <button onclick="toggleAdminModal()" class="p-2 text-rose-200/60 hover:text-rose-100 transition rounded-full hover:bg-white/5" title="Yönetici Girişi">
      <i data-lucide="lock" class="w-5 h-5"></i>
    </button>
  </header>

  <!-- Ana İçerik -->
  <main class="container mx-auto max-w-4xl px-4 py-6 relative z-10 space-y-8 flex-grow">
    
    <!-- Başlık / Karşılama Kartı -->
    <div class="glass-card rounded-3xl p-8 text-center space-y-4 shadow-2xl relative overflow-hidden">
      <div class="space-y-1">
        <p class="text-xs tracking-widest text-rose-300 uppercase font-medium">Hoş Geldiniz</p>
        <h1 class="text-4xl md:text-5xl font-serif-custom text-white font-medium tracking-wide">Sinem & Harun</h1>
        <p class="text-sm text-rose-200/80 pt-1 font-light">17 Ekim 2026</p>
      </div>

      <p class="text-sm text-rose-100/70 max-w-md mx-auto font-light leading-relaxed">
        Bu özel günümüzden çektiğiniz tüm güzel anıları ve fotoğrafları bizimle paylaşarak albümümüze katkıda bulunabilirsiniz. ✨
      </p>

      <!-- Yükleme Butonu -->
      <div class="pt-2">
        <button id="upload_widget" class="inline-flex items-center space-x-2 bg-gradient-to-r from-rose-600 to-rose-800 hover:from-rose-500 hover:to-rose-700 text-white px-8 py-3.5 rounded-full font-medium shadow-lg hover:shadow-rose-900/40 transition-all transform hover:-translate-y-0.5 active:translate-y-0">
          <i data-lucide="camera" class="w-5 h-5"></i>
          <span>Fotoğraf Yükle</span>
        </button>
      </div>
    </div>

    <!-- Fotoğraf Galerisi Alanı (Dahili / Kendi İçinde Açılan) -->
    <section class="space-y-4">
      <div class="flex items-center justify-between border-b border-rose-900/40 pb-3">
        <h2 class="text-lg font-serif-custom text-white flex items-center gap-2">
          <i data-lucide="image" class="w-5 h-5 text-rose-400"></i>
          Paylaşılan Fotoğraflar
        </h2>
        <span id="photoCount" class="text-xs text-rose-200/60 bg-white/5 px-3 py-1 rounded-full">Yükleniyor...</span>
      </div>

      <!-- Fotoğrafların Dizileceği Grid -->
      <div id="galleryGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
        <!-- JS ile dinamik dolacak -->
      </div>
    </section>
  </main>

  <!-- Alt Bilgi / Footer (Özel İmzalı & Linkli) -->
  <footer class="relative z-10 text-center text-xs text-rose-100/70 py-6 font-light space-y-1">
    <div>Sevgiyle Paylaşın • Sinem & Harun ✨</div>
    <div class="text-[11px] opacity-80">
      Created by 
      <a href="https://instagram.com/ori.bilisim" target="_blank" class="font-semibold tracking-wide underline hover:text-white transition">
        ori.bilisim 🤍
      </a>
    </div>
  </footer>

  <!-- Yönetici Giriş Modalı -->
  <div id="adminModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden">
    <div class="glass-modal rounded-2xl p-6 w-full max-w-xs space-y-4 shadow-2xl relative">
      <button onclick="toggleAdminModal()" class="absolute top-4 right-4 text-rose-200/60 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <h3 class="text-lg font-serif-custom text-center text-white">Yönetici Girişi</h3>
      <input type="password" id="adminPassword" placeholder="Şifre" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-2.5 text-white placeholder-rose-200/40 focus:outline-none focus:border-rose-400 text-center text-sm">
      <button onclick="verifyAdmin()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-medium py-2.5 rounded-xl transition text-sm">Giriş Yap</button>
    </div>
  </div>

  <!-- Tam Ekran Fotoğraf İnceleme Modalı (Lightbox) -->
  <div id="lightboxModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4" onclick="closeLightbox()">
    <button class="absolute top-4 right-4 text-white/80 hover:text-white p-2">
      <i data-lucide="x" class="w-8 h-8"></i>
    </button>
    <img id="lightboxImg" src="" class="max-h-[90vh] max-w-[90vw] object-contain rounded-lg shadow-2xl" onclick="event.stopPropagation()">
  </div>

  <!-- Uygulama Mantığı (JS) -->
  <script>
    lucide.createIcons();

    const CLOUD_NAME = "qlxdd0ki";
    const UPLOAD_PRESET = "SINEM_HARUN";
    const ADMIN_PASS = "171026";
    let isAdmin = false;

    // Cloudinary Yükleme Widget'ı
    const myWidget = cloudinary.createUploadWidget({
        cloudName: CLOUD_NAME,
        uploadPreset: UPLOAD_PRESET,
        sources: ['local', 'camera'],
        multiple: true,
        maxFiles: 10,
        styles: {
          palette: {
            window: "#1a050b",
            sourceBg: "#150308",
            windowBorder: "#2b0914",
            tabIcon: "#f43f5e",
            inactiveTabIcon: "#9f1239",
            menuIcons: "#f43f5e",
            link: "#f43f5e",
            action: "#e11d48",
            inProgress: "#f43f5e",
            complete: "#10b981",
            error: "#f87171",
            textDark: "#000000",
            textLight: "#ffffff"
          }
        }
      }, (error, result) => { 
        if (!error && result && result.event === "success") {
          fetchPhotos(); // Yükleme başarılı olunca galeriyi yenile
        }
      }
    );

    document.getElementById("upload_widget").addEventListener("click", function(){
      myWidget.open();
    }, false);

    // Fotoğrafları Cloudinary'den Çekip Galeriye Dizme
    async function fetchPhotos() {
      const grid = document.getElementById('galleryGrid');
      const countEl = document.getElementById('photoCount');
      
      try {
        const response = await fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/${UPLOAD_PRESET}.json`);
        
        if(!response.ok) {
           grid.innerHTML = `<div class="col-span-full text-center text-rose-200/50 py-8 text-sm">Henüz fotoğraf yüklenmemiş. İlk fotoğrafı siz paylaşın!</div>`;
           countEl.innerText = "0 Fotoğraf";
           return;
        }

        const data = await response.json();
        const photos = data.resources || [];
        
        countEl.innerText = `${photos.length} Fotoğraf`;

        if (photos.length === 0) {
          grid.innerHTML = `<div class="col-span-full text-center text-rose-200/50 py-8 text-sm">Henüz fotoğraf yüklenmemiş.</div>`;
          return;
        }

        grid.innerHTML = photos.map(photo => {
          const imgUrl = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/c_fill,w_400,h_400,q_auto,f_auto/v${photo.version}/${photo.public_id}.${photo.format}`;
          const fullUrl = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/q_auto,f_auto/v${photo.version}/${photo.public_id}.${photo.format}`;
          
          return `
            <div class="group relative aspect-square rounded-2xl overflow-hidden glass-card cursor-pointer shadow-md hover:shadow-xl transition-all duration-300">
              <img src="${imgUrl}" alt="Anı Fotoğrafı" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onclick="openLightbox('${fullUrl}')">
              ${isAdmin ? `
                <button onclick="event.stopPropagation(); deletePhoto('${photo.public_id}')" class="absolute top-2 right-2 bg-red-600/80 hover:bg-red-600 text-white p-1.5 rounded-full backdrop-blur-sm transition">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              ` : ''}
            </div>
          `;
        }).join('');

        lucide.createIcons();

      } catch (err) {
        grid.innerHTML = `<div class="col-span-full text-center text-rose-200/50 py-8 text-sm">Fotoğraflar yüklenirken bir durum oluştu.</div>`;
        countEl.innerText = "";
      }
    }

    // Modal İşlemleri
    function toggleAdminModal() {
      const modal = document.getElementById('adminModal');
      modal.classList.toggle('hidden');
    }

    function verifyAdmin() {
      const input = document.getElementById('adminPassword').value;
      if (input === ADMIN_PASS) {
        isAdmin = true;
        alert("Yönetici moduna geçildi. Artık fotoğrafları silebilirsiniz.");
        toggleAdminModal();
        fetchPhotos();
      } else {
        alert("Hatalı şifre!");
      }
    }

    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightboxModal').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').classList.add('hidden');
    }

    // Doğrulama: Adımın başarılı şekilde çalışıp çalışmadığını galeriyi yükleyerek test ediyoruz.
    fetchPhotos();
  </script>
</body>
</html>
